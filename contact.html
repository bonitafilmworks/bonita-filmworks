<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — bonita filmworks company</title>
    <meta name="description" content="Contact Bonita FilmWorks Company about your project." />
    <meta name="theme-color" content="#f7f2f0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="assets/cursor-ant.png" type="image/png" sizes="64x64" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true">
      <img
        class="backdrop__logo"
        src="assets/logo-ant.png"
        alt=""
        width="2200"
        height="1676"
        decoding="async"
      />
    </div>

    <div class="site">
      <header class="site-header">
        <a class="brand" href="index.html">
          <img
            class="brand__logo"
            src="assets/logo-ant-small.png"
            alt="bonita filmworks company"
            width="480"
            height="758"
            decoding="async"
          />
        </a>
      </header>

      <main class="project">
        <h1 class="project__title">Contact</h1>

        <form
          class="contact"
          id="contact-form"
          action="https://formsubmit.co/bonitafilmworks@gmail.com"
          method="POST"
        >
          <input type="hidden" name="_subject" value="Project enquiry" />
          <input type="hidden" name="_template" value="table" />
          <input type="hidden" name="_captcha" value="false" />
          <input
            class="contact__honey"
            type="text"
            name="_honey"
            tabindex="-1"
            autocomplete="off"
            aria-hidden="true"
          />

          <div class="contact__field">
            <label for="project">Project</label>
            <input id="project" name="Project" type="text" autocomplete="off" required />
          </div>

          <div class="contact__field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>

          <div class="contact__field">
            <label for="info">Info</label>
            <textarea id="info" name="Info" rows="7" required></textarea>
          </div>

          <label class="contact__consent">
            <input id="subscribe" name="subscribe" type="checkbox" checked />
            <span>
              Add me to the Bonita FilmWorks mailing list — occasional news,
              unsubscribe any time.
            </span>
          </label>

          <button class="button" type="submit">
            <span class="button__label">Send</span>
          </button>

          <p class="contact__status" id="contact-status" role="status" aria-live="polite"></p>
        </form>

        <!-- Kit mailing list: receives the address when the box is ticked. -->
        <form
          class="contact__subscribe"
          id="subscribe-form"
          action="https://app.kit.com/forms/10175681/subscriptions"
          method="post"
          target="subscribe-target"
          data-sv-form="10175681"
          data-uid="2e5520d864"
          hidden
        >
          <input type="hidden" name="email_address" />
        </form>
        <iframe
          class="contact__subscribe-target"
          name="subscribe-target"
          title="Mailing list subscription"
          tabindex="-1"
          aria-hidden="true"
        ></iframe>

        <p class="contact__note">
          Prefer email? Write to
          <a href="mailto:bonitafilmworks@gmail.com">bonitafilmworks@gmail.com</a>.
        </p>
      </main>
    </div>
    <script src="contact.js" defer></script>
    <script src="nav-highlight.js" defer></script>
  </body>
</html>
